[workspace]
name = "sam-road"
version = "0.1.0"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.11.*"

# PyTorch stack — must come from pytorch channel with explicit CUDA build
pytorch = { version = ">=2.1,<3", channel = "pytorch" }
torchvision = { version = "*", channel = "pytorch" }
pytorch-cuda = { version = "12.4.*", channel = "pytorch" }

# Scientific computing / data
numpy = ">=1.24"
scipy = ">=1.10"
matplotlib = ">=3.7"
scikit-image = ">=0.21"
scikit-learn = ">=1.3"
shapely = ">=2.0"

# Computer vision / image I/O
imageio = ">=2.30"

# Graph libraries
rtree = ">=1.0"
networkx = ">=3.0"
python-igraph = ">=0.10"

# Config / utilities
pyyaml = ">=6.0"

# Training framework
pytorch-lightning = ">=2.0"
torchmetrics = ">=1.0"

[pypi-dependencies]
# Not reliably available in conda-forge
wandb = ">=0.15"
addict = ">=2.4"
tcod = ">=15.0"
opencv-python = ">=4.8"

[tasks]
train-cityscale = "python train.py --config=config/toponet_vitb_512_cityscale.yaml"
train-spacenet = "python train.py --config=config/toponet_vitb_256_spacenet.yaml"
train-cityscale-fp16 = "python train.py --config=config/toponet_vitb_512_cityscale.yaml --precision=16"
train-spacenet-fp16 = "python train.py --config=config/toponet_vitb_256_spacenet.yaml --precision=16"
dev-run = "python train.py --config=config/toponet_vitb_256_spacenet.yaml --fast_dev_run"
