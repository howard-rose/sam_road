DATASET: 'spacenet'

# SAM-Road++ fast fine-tuning config (target: <1 hour on RTX 3050 4GB).
# Encoder frozen + torch.no_grad() → no encoder backward, freed VRAM allows BATCH_SIZE=8.
# 1 epoch with --limit_train_batches=6000 ≈ 30 min; full epoch ≈ 50 min.
NO_SAM: False

SAM_VERSION: 'vit_b'
SAM_CKPT_PATH: 'sam_ckpts/sam_vit_b_01ec64.pth'
PATCH_SIZE: 256
BATCH_SIZE: 8
GRAD_ACCUM_STEPS: 8
DATA_WORKER_NUM: 2
TRAIN_EPOCHS: 1
BASE_LR: 0.0005
FREEZE_ENCODER: True
ENCODER_LR_FACTOR: 0.1
ENCODER_LORA: False
FOCAL_LOSS: False
USE_SAM_DECODER: False

# TOPONET
TOPO_SAMPLE_NUM: 128
TOPONET_VERSION: 'normal'
USE_EXTENDED_LINE: True

# Inference (same thresholds as baseline until re-calibrated)
INFER_BATCH_SIZE: 64
SAMPLE_MARGIN: 0
INFER_PATCHES_PER_EDGE: 16

ITSC_THRESHOLD: 0.195
ROAD_THRESHOLD: 0.341
TOPO_THRESHOLD: 0.705
# pixels
ITSC_NMS_RADIUS: 8
ROAD_NMS_RADIUS: 16
NEIGHBOR_RADIUS: 64
MAX_NEIGHBOR_QUERIES: 16
