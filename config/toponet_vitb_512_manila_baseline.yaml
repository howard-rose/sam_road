DATASET: 'manila'

# SAM-Road baseline fine-tuning on Metro Manila (0.6 m/px, 512×512 tiles).
# Freeze encoder; train only TopoNet with standard pair_proj (258-dim, no extended-line).
# Use this as the ablation control vs toponet_vitb_512_manila_samroadplus.yaml.
NO_SAM: False

SAM_VERSION: 'vit_b'
SAM_CKPT_PATH: 'sam_ckpts/sam_vit_b_01ec64.pth'
PATCH_SIZE: 512
BATCH_SIZE: 2
GRAD_ACCUM_STEPS: 8
DATA_WORKER_NUM: 0
TRAIN_EPOCHS: 1
BASE_LR: 0.0005
FREEZE_ENCODER: True
ENCODER_LR_FACTOR: 0.1
ENCODER_LORA: False
FOCAL_LOSS: False
USE_SAM_DECODER: False

# TOPONET — standard (no extended-line)
TOPO_SAMPLE_NUM: 512
TOPONET_VERSION: 'normal'
USE_EXTENDED_LINE: False

# Inference — pixel thresholds scaled ×1.67 from 1.0 m/px baseline:
#   ROAD_NMS_RADIUS:  16 × 1.67 ≈ 27
#   ITSC_NMS_RADIUS:   8 × 1.67 ≈ 13
#   NEIGHBOR_RADIUS:  64 × 1.67 ≈ 107
INFER_BATCH_SIZE: 32
SAMPLE_MARGIN: 0
INFER_PATCHES_PER_EDGE: 1

ITSC_THRESHOLD: 0.248
ROAD_THRESHOLD: 0.364
TOPO_THRESHOLD: 0.500
# pixels
ITSC_NMS_RADIUS: 13
ROAD_NMS_RADIUS: 27
NEIGHBOR_RADIUS: 107
MAX_NEIGHBOR_QUERIES: 16
