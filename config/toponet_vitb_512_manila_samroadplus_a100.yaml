DATASET: 'manila'

# SAM-Road++ fine-tuning on Metro Manila — A100 (unfrozen encoder).
# USE_EXTENDED_LINE: True (pair_proj 408-dim with extended-line road mask features).
NO_SAM: False

SAM_VERSION: 'vit_b'
SAM_CKPT_PATH: 'sam_ckpts/sam_vit_b_01ec64.pth'
PATCH_SIZE: 512
BATCH_SIZE: 8
GRAD_ACCUM_STEPS: 4
DATA_WORKER_NUM: 4
TRAIN_EPOCHS: 20
BASE_LR: 0.0005
FREEZE_ENCODER: False
ENCODER_LR_FACTOR: 0.1
ENCODER_LORA: False
FOCAL_LOSS: False
USE_SAM_DECODER: False

# TOPONET
TOPO_SAMPLE_NUM: 512
TOPONET_VERSION: 'normal'
USE_EXTENDED_LINE: True

# Inference — pixel thresholds scaled ×1.67 from 1.0 m/px baseline:
#   ROAD_NMS_RADIUS:  16 × 1.67 ≈ 27
#   ITSC_NMS_RADIUS:   8 × 1.67 ≈ 13
#   NEIGHBOR_RADIUS:  64 × 1.67 ≈ 107
INFER_BATCH_SIZE: 32
SAMPLE_MARGIN: 0
INFER_PATCHES_PER_EDGE: 1

ITSC_THRESHOLD: 0.248
ROAD_THRESHOLD: 0.364
TOPO_THRESHOLD: 0.500
# pixels
ITSC_NMS_RADIUS: 13
ROAD_NMS_RADIUS: 27
NEIGHBOR_RADIUS: 107
MAX_NEIGHBOR_QUERIES: 16
